# Publica o site da Desata como Worker de assets estáticos.
#
#   npx wrangler deploy
#
# O nome do Worker é o endereço: este publica em desata.jvctrfelix.workers.dev.
# O que vai e o que não vai para o ar está no .assetsignore.
#
# ATENÇÃO: o Worker antigo, "futuro", NÃO é renomeado por esta mudança. O
# primeiro deploy cria um Worker novo, e o "futuro" continua no ar com o site
# de gestão clínica até você apagá-lo:
#
#   npx wrangler delete --name futuro

name = "desata"
compatibility_date = "2026-08-21"

[assets]
directory = "./"
# qualquer caminho cai na página única, em vez de dar 404
not_found_handling = "single-page-application"
