# Publica o site da Desata como Worker de assets estáticos.
#
#   npx wrangler deploy
#
# ATENÇÃO: isto substitui o conteúdo do Worker chamado "futuro" que já está
# no ar. O que estiver publicado lá agora é trocado pelo index.html daqui.
# O que vai e o que não vai para o ar está no .assetsignore.

name = "futuro"
compatibility_date = "2026-08-21"

[assets]
directory = "./"
# qualquer caminho cai na página única, em vez de dar 404
not_found_handling = "single-page-application"
