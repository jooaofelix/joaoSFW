<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Desata — demonstração 148</title>
<link rel="stylesheet" href="../../assets/css/fontes.css">
<style>
:root{--off:#F4F0E8;--graf:#242424;--lar:#E66A35;--suave:#5B5650;--claro:rgba(244,240,232,.76);}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1920px;overflow:hidden;background:var(--off);
     font-family:'Figtree',system-ui,sans-serif;color:var(--graf);position:relative;}
.cena{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;}

/* ---------------- intro ---------------- */
.intro{justify-content:center;gap:0;background:var(--off);z-index:30;
       transition:opacity .7s ease, transform .9s cubic-bezier(.4,0,.2,1);}
.intro.sai{opacity:0;transform:scale(1.06);pointer-events:none;}
.intro__logo{width:420px;opacity:0;transform:translateY(26px) scale(.96);
             animation:sobe .9s cubic-bezier(.22,1,.36,1) .15s forwards;}
.intro__pill{margin-top:46px;padding:12px 30px;border-radius:999px;background:var(--graf);
             color:var(--off);font-size:21px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
             opacity:0;animation:sobe .8s cubic-bezier(.22,1,.36,1) .55s forwards;}
.intro h1{font-size:96px;line-height:1.02;letter-spacing:-.035em;font-weight:800;margin-top:40px;
          text-align:center;opacity:0;animation:sobe .9s cubic-bezier(.22,1,.36,1) .8s forwards;}
.intro h1 em{font-style:normal;color:var(--lar);}
.intro p{font-size:30px;color:var(--suave);margin-top:22px;text-align:center;max-width:22ch;
         opacity:0;animation:sobe .9s cubic-bezier(.22,1,.36,1) 1.05s forwards;}
@keyframes sobe{to{opacity:1;transform:none;}}
.intro__laco{position:absolute;left:-60px;bottom:170px;width:1240px;color:var(--lar);}

/* laço que se desenha */
.laco path{fill:none;stroke:currentColor;stroke-width:9;stroke-linecap:round;
           stroke-dasharray:var(--len,2600);stroke-dashoffset:var(--len,2600);}
.laco.desenha path{animation:desatar 2.2s cubic-bezier(.22,.61,.36,1) forwards;}
@keyframes desatar{to{stroke-dashoffset:0;}}

/* ---------------- demonstração ---------------- */
.demo{padding-top:88px;opacity:0;transition:opacity .6s ease;}
.demo.on{opacity:1;}
.demo__topo{display:flex;align-items:center;gap:24px;}
.demo__topo img{width:224px;}
.demo__tag{padding:9px 20px;border-radius:999px;border:2px solid var(--graf);
           font-size:17px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;}

.fone{position:relative;margin-top:58px;width:568px;height:1180px;border-radius:62px;
      background:var(--graf);padding:14px;box-shadow:0 50px 90px -30px #24242455;
      transform:translateY(70px) scale(.97);opacity:0;
      transition:transform 1s cubic-bezier(.22,1,.36,1),opacity .8s ease;}
.fone.on{transform:none;opacity:1;}
.fone__tela{width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--off);position:relative;}
.fone__entalhe{position:absolute;top:22px;left:50%;transform:translateX(-50%);
               width:132px;height:26px;border-radius:14px;background:var(--graf);z-index:5;}
iframe{width:390px;height:810px;border:0;transform:scale(1.3846);transform-origin:0 0;}

.toque{position:absolute;width:66px;height:66px;border-radius:50%;z-index:9;
       background:#24242426;border:3px solid #242424aa;opacity:0;
       transform:translate(-50%,-50%) scale(.8);
       transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1),opacity .3s,transform .3s;}
.toque.on{opacity:1;transform:translate(-50%,-50%) scale(1);}
.toque.bate{animation:bate .5s ease;}
@keyframes bate{0%{transform:translate(-50%,-50%) scale(1);}
                40%{transform:translate(-50%,-50%) scale(.72);background:#E66A3566;}
                100%{transform:translate(-50%,-50%) scale(1);}}
.onda{position:absolute;width:66px;height:66px;border-radius:50%;border:4px solid var(--lar);
      z-index:8;transform:translate(-50%,-50%) scale(1);opacity:0;pointer-events:none;}
.onda.toca{animation:onda .75s ease-out;}
@keyframes onda{0%{opacity:.85;transform:translate(-50%,-50%) scale(.9);}
                100%{opacity:0;transform:translate(-50%,-50%) scale(3.2);}}

.legenda{margin-top:62px;height:150px;display:flex;align-items:center;justify-content:center;
         width:900px;text-align:center;}
.legenda span{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.18;
              opacity:0;transform:translateY(16px);transition:opacity .45s ease,transform .5s cubic-bezier(.22,1,.36,1);}
.legenda span.on{opacity:1;transform:none;}
.legenda b{color:var(--lar);font-weight:800;}

/* ---------------- fecho ---------------- */
.outro{background:var(--graf);color:var(--off);justify-content:center;z-index:40;
       opacity:0;pointer-events:none;transition:opacity .8s ease;}
.outro.on{opacity:1;}
.outro img{width:430px;opacity:0;transform:translateY(22px);
           transition:opacity .8s ease,transform .9s cubic-bezier(.22,1,.36,1);}
.outro.on img{opacity:1;transform:none;transition-delay:.2s;}
.outro h2{font-size:72px;letter-spacing:-.03em;font-weight:800;margin-top:54px;text-align:center;
          opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .9s cubic-bezier(.22,1,.36,1);}
.outro.on h2{opacity:1;transform:none;transition-delay:.45s;}
.outro h2 em{font-style:normal;color:var(--lar);}
.outro .contato{margin-top:60px;font-size:36px;font-weight:600;color:var(--claro);text-align:center;
                line-height:1.75;opacity:0;transform:translateY(22px);
                transition:opacity .8s ease,transform .9s cubic-bezier(.22,1,.36,1);}
.outro.on .contato{opacity:1;transform:none;transition-delay:.7s;}
.outro .aviso{position:absolute;bottom:96px;font-size:24px;letter-spacing:.14em;text-transform:uppercase;
              color:#f4f0e866;opacity:0;transition:opacity .8s ease .95s;}
.outro.on .aviso{opacity:1;}
.outro__laco{position:absolute;right:-120px;top:150px;width:1000px;color:var(--lar);opacity:.55;}
</style>
</head>
<body>

<!-- ============ abertura ============ -->
<section class="cena intro" id="intro">
  <img class="intro__logo" src="../../assets/img/logo-desata-colorido.png" alt="Desata">
  <div class="intro__pill">Demonstração</div>
  <h1>Loja de roupas<br>que vende pelo <em>celular</em></h1>
  <p>Da vitrine ao pedido, sem complicação.</p>
  <svg class="intro__laco laco" id="laco-intro" viewBox="0 0 420 300">
    <path d="M0 214 C 96 214, 140 150, 214 156 C 286 162, 300 232, 246 250 C 200 265, 172 214, 216 178 C 268 136, 372 158, 420 96"/>
  </svg>
</section>

<!-- ============ demonstração ============ -->
<section class="cena demo" id="demo">
  <div class="demo__topo">
    <img src="../../assets/img/logo-desata-colorido.png" alt="Desata">
    <span class="demo__tag">Demonstração</span>
  </div>

  <div class="fone" id="fone">
    <div class="fone__entalhe"></div>
    <div class="fone__tela">
      <iframe id="tela" src="loja.html"></iframe>
      <div class="onda" id="onda"></div>
      <div class="toque" id="toque"></div>
    </div>
  </div>

  <div class="legenda"><span id="legenda"></span></div>
</section>

<!-- ============ fecho ============ -->
<section class="cena outro" id="outro">
  <svg class="outro__laco laco" id="laco-outro" viewBox="0 0 420 300">
    <path d="M0 214 C 96 214, 140 150, 214 156 C 286 162, 300 232, 246 250 C 200 265, 172 214, 216 178 C 268 136, 372 158, 420 96"/>
  </svg>
  <img src="../../assets/img/logo-desata-branco.png" alt="Desata">
  <h2>Tecnologia que <em>descomplica</em>.</h2>
  <p class="contato" id="contato"></p>
  <p class="aviso">Demonstração · peças e preços ilustrativos</p>
</section>

<script src="roteiro.js"></script>
</body>
</html>
